name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Test native integration on VS Code 1.95.3
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Test native integration on VS Code 1.95.3
        if: runner.os == 'Windows'
        run: npm run test:vscode
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: branch-diff-${{ runner.os }}
          path: '*.vsix'
          if-no-files-found: error
